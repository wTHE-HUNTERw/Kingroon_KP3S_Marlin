name: Build Kingroon KP3S Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio

    - name: Build Firmware Sin BLTouch (Stock MBL)
      run: |
        cp config_kp3s/stock_mbl/Configuration.h Marlin/
        cp config_kp3s/stock_mbl/Configuration_adv.h Marlin/
        pio run -e mks_robin_nano_v1v2
        mkdir -p build_output/Sin_BLTouch
        cp .pio/build/mks_robin_nano_v1v2/Robin_nano.bin build_output/Sin_BLTouch/

    - name: Build Firmware Con BLTouch (ABL Bilinear)
      run: |
        cp config_kp3s/bltouch_abl/Configuration.h Marlin/
        cp config_kp3s/bltouch_abl/Configuration_adv.h Marlin/
        pio run -e mks_robin_nano_v1v2
        mkdir -p build_output/Con_BLTouch
        cp .pio/build/mks_robin_nano_v1v2/Robin_nano.bin build_output/Con_BLTouch/

    - name: Upload Binaries as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Kingroon_KP3S_Marlin_Firmware
        path: build_output/

